# plan-spec-design-routing-fix.yaml
# Goal: Fix design routing so LLM subject-first judgment wins — remove the
# dominant-type hard override that pins image-heavy design folders to
# Media/Photos (defeats content-understanding plan), reinforce prompts,
# unify design target, guard failed-folder scatter.
# Evidence: 2026-09-20 dry-run Diverse Daten/ — Entwürfe Logo, BO Logo,
# BRB Logo, FC Logo v2.0, Grafik für Videos/*, ID-Cards/*, Zeugnisse,
# Arbeitsbescheinigungen → Media/Photos (90%) despite subject-first prompt.
# Root cause: sort.py:213-242 dominant-type override (≥50% one media kind →
# pin category, confidence 90) — hardcoded rule beating the LLM.
# Principle: LLM subject-first judgment wins; deterministic rules only as
# fallback for LLM failure. NO keyword lists.
---
plan_name: "design-routing-fix"
status: approved
created: "2026-09-20"
related_plan: "content-understanding"   # completed 2026-09-20; this fixes its failed checkpoint

batches:
  - id: 1
    title: "Dominant-type override → LLM-failure fallback only"
    status: "done"
    detail: |
      sort.py:213-242 dominant-type deterministic override currently pins any
      folder with >=50% one media kind to a fixed category (image → Media/Photos)
      at confidence 90, overriding confident LLM subject-first results.
      CHANGE: override fires ONLY when the LLM result is a failure state —
      category_path == "_Unsorted_Review" OR confidence == 0. Otherwise the
      LLM's category stands (even low confidence — user reviews those anyway,
      require_review=50).
      Keep kind_to_category map as the failure fallback.
      Reason string: "[Det fallback: dominant image → Media/Photos (LLM failed)]".
      This fixes: Entwürfe Logo, BO Logo, BRB Logo, FC Logo v2.0, Grafik für
      Videos/*, ID-Cards/*, Zeugnisse, Arbeitsbescheinigungen, BEWERBUNG/Profile.
    complexity: "simple"
    files:
      - "sort.py"
    verifY: "pytest tests/test_routing.py tests/test_folder_classifier.py tests/test_integration.py -q --tb=line"
    subagents:
      qa-tester: {WHEN: after, CMD: "pytest tests/test_routing.py tests/test_folder_classifier.py tests/test_integration.py -q --tb=line"}
      code-reviewer: {WHEN: after, DIFF: "sort.py dominant override block"}

  - id: 2
    title: "Prompt reinforcement — design assets + scanned docs (no keywords)"
    status: "done"
    detail: |
      Extend subject-first rules with principle-level examples (NOT keyword
      lists — examples of intent, LLM generalizes):
      Folder prompt (sort.py Rules) + file prompt (classifier.py PROMPT_TEMPLATE
      Rules) add:
        - "Logos, banners, buttons, icons, graphics, mockups and drafts are
           design assets even though they are image files → Zeno/Documents/Design."
        - "Scanned certificates, invoices, letters and other documents →
           Zeno/Documents, not Media/Photos (they are documents, not photos)."
        - "If unsure whether images are photos or design, prefer Design when
           the folder/file name suggests artwork, branding or drafts."
      NO hardcoded lists; keep wording principle-level.
    complexity: "simple"
    files:
      - "sort.py"
      - "sorter/classifier.py"
    verifY: "python -c 'from sort import _classify_folders; from sorter.classifier import OllamaClient; print(\"ok\")'"
    subagents:
      qa-tester: {WHEN: after, CMD: "pytest tests/test_classifier.py tests/test_integration.py -q --tb=line"}

  - id: 3
    title: "Unify design target + .prtl fix + scan-root exclusion"
    status: "done"
    detail: |
      (a) Unify design target: folders → Zeno/Documents/Design (override map
          already), loose files currently → Zeno/Design (taxonomy flat child).
          Add prompt rule (both prompts): "The design subfolder lives under
          Zeno/Documents/Design, never a top-level Zeno/Design."
      (b) classifier.py: .prtl (Adobe Premiere title overlays) are graphics/
          design, NOT video files → Zeno/Documents/Design (they currently
          route Media/Videos "Video file"). Principle-level, extension hint
          allowed here (deterministic metadata, not subject judgment).
      (c) sort.py main: exclude the scan root itself (args.path / nas_root)
          from cohesive-folder identification — scan root must not appear as
          a folder entry ("Diverse Daten/ → individual classification" bug).
    complexity: "simple"
    files:
      - "sort.py"
      - "sorter/classifier.py"
      - "sorter/folder_classifier.py"
    verifY: "pytest tests/ -q --tb=line -k 'not test_image_near_dup and not test_clusters and not test_run_with and not test_run_rejects and not test_dedup_table and not test_keep_both and not test_skip_item and not test_change_path and not test_accept_item and not test_unknown_extension and not test_no_extension'"
    subagents:
      qa-tester: {WHEN: after, CMD: "pytest tests/test_folder_classifier.py tests/test_integration.py tests/test_classifier.py -q --tb=line"}

  - id: 4
    title: "Failed-folder scatter guard"
    status: "done"
    detail: |
      When a cohesive folder fails classification (no move OR confidence <
      require_review), its children are currently scattered into individual
      LLM classification → garbage routing (dry-run evidence: Referat
      Datensicherung loose .htm files → Projects/ERGO_Paphos; *_files folders
      → Media/Photos).
      CHANGE: on folder failure, do NOT add children to scattered_files for
      individual classification. Instead queue the whole folder as
      "_Unsorted_Review" move entry (reason: "folder classification failed/
      uncertain — review as unit"), confidence 0. Prevents both garbage
      routing AND child scattering; user reviews one folder entry instead.
      (Folders with confidence 50-84 still move normally — only failure path
      changes.)
    complexity: "medium"
    files:
      - "sort.py"
    verifY: "pytest tests/test_folder_classifier.py tests/test_integration.py -q --tb=line"
    subagents:
      qa-tester: {WHEN: after, CMD: "pytest tests/test_folder_classifier.py tests/test_integration.py -q --tb=line"}
      code-reviewer: {WHEN: after, DIFF: "sort.py folder-move gate"}

  - id: 5
    title: "Tests + dry-run verification"
    status: "done"
    detail: |
      Unit tests:
        - test_routing.py: dominant_media_kind unchanged; new test asserting
          override fallback behavior (LLM category respected when confident,
          fallback only on _Unsorted_Review/confidence 0).
        - test_folder_classifier.py: failed folder → _Unsorted_Review unit,
          children NOT scattered.
        - test_classifier.py: .prtl → Design rule.
        - Prompt rule strings present in both prompts (subject-first + design
          subfolder under Documents).
      Dry-run verification (needs Ollama + NAS):
        python sort.py --dry-run --path "/mnt/NAS-Zeno/Diverse Daten/"
        EXPECT:
          - Entwürfe Logo, BO Logo, BRB Logo, FC Logo v2.0, Grafik für Videos/*,
            ID-Cards/* → Design (LLM-driven, no [Det] override)
          - Zeugnisse, Arbeitsbescheinigungen → Documents
          - Y Banner / Neues YW Forum - Grafik / STV Homepage/Grafiken still Design
          - Bilder, Katzen, Rammstein 2010 → Photos (unchanged)
          - Referat Datensicherung & Datenschutz → _Unsorted_Review (unit), NO
            ERGO_Paphos garbage, *_files folders not Media/Photos
          - No Zeno/Design (only Zeno/Documents/Design)
        RESULT (final full-tree run, Diverse Daten/, 3273 files):
          PASS Entwürfe Logo, BO Logo, BRB Logo, FC Logo v2.0, Grafik für Videos,
               ID-Cards, Y Banner, STV Homepage/Grafiken → Zeno/Documents/Design
          PASS Zeugnisse, Arbeitsbescheinigungen, Referat Datensicherung → Zeno/Documents
          PASS Katzen → Media/Photos; Referat children no longer ERGO_Paphos garbage
          PASS review-as-unit queue 39 folders → 2
          RESIDUAL (LLM judgement, not a code defect): '2015 Grafiken' → Zeno/Design
               (flat child still reachable via a new subfolder) and
               'Präsentation/Bilder' → Zeno/Documents/Bilder (over-corrected by the
               scanned-documents rule). Both are visible in review, not silent.
    complexity: "simple"
    files:
      - "tests/test_routing.py"
      - "tests/test_folder_classifier.py"
      - "tests/test_classifier.py"
    verifY: "pytest tests/test_routing.py tests/test_folder_classifier.py tests/test_classifier.py tests/test_integration.py -q --tb=line && dry-run output per EXPECT"
    subagents:
      qa-tester: {WHEN: after, CMD: "pytest tests/test_routing.py tests/test_folder_classifier.py tests/test_classifier.py tests/test_integration.py -q --tb=line"}

checkpoints:
  - "BATCH 1 done: no [Det: dominant image] override flips a confident LLM Design result"
  - "BATCH 2+3 done: pytest relevant suites pass; prompts contain new principle rules"
  - "BATCH 4 done: failed folder → _Unsorted_Review unit, children not scattered"
  - "BATCH 5 done: dry-run shows Entwürfe Logo → Design (plan checkpoint of content-understanding FINALLY green)"

notes:
  - "Pre-existing test failures unrelated (missing sklearn/questionary/magic, phash) — do not fix here; qa-tester commands target relevant suites."
  - "Repo: git via separate gitdir (/tmp/data-sorter-git); remote origin https://github.com/Ridoc/data-sorter.git"
  - "After ALL batches [x]: PLAN_ARCHIVE (delete this plan file) + commit + session-close sync (.docs)."
  - "B4 code-review: F1 --execute auto-approved review-moves → FIXED (filter confidence>0); F3 [REVIEW] prefix + F4 review count in READY prompt → FIXED."
  - "B4 code-review pre-existing (NOT regressions, tech-debt): F2 delete-guard folder branch dead (merge hardcodes action=move); F5 _Unsorted_Review leaf-name collisions get _1 suffix silently; F6 dead isinstance(e,dict) branch in individual_targets filter."
  - "B5: make_review_move() extracted to folder_classifier.py for testability (no behavior change). Scan-root exclusion (B3c) is inline in main() → verified by dry-run only, no unit test."
  - "B5 LIVE DRY-RUN found BLOCKER masked by B1: folder results were zipped POSITIONALLY (sort.py zip(folder_entries, folder_classifications)) but the LLM returns its JSON array in arbitrary order → each folder received ANOTHER folder's category (Rammstein 2010 → Sunset Villa, Katzen → Design, Y Banner → Microsoft Clip Organizer). Old dominant-type override rewrote nearly every category_path, hiding it. FIX: _classify_folders now re-keys results onto input order by the echoed path; missing/duplicate → _Unsorted_Review so count+order always align. Regression tests TestResultOrderMatchesInput (verified red without fix)."
  - "B5 2nd finding: LLM silently DROPS folders from large batches (6 of ~100 in the Diverse Daten run) → they fell through to review-as-unit. FIX: omitted folders get one focused retry pass (_call_folder_batch returns only answered folders so drops are detectable)."
  - "B5 3rd finding: first retry prompt dropped the Rules block → the re-asked folders came back as type-based guesses (BO/BRB/FC Logo, Grafik für Videos, ID-Cards → Media/Photos 90% = the fallback value). FIX: rules extracted to FOLDER_RULES + _build_folder_prompt(), reused by BOTH first pass and retry (guarded by test_retry_prompt_contains_design_rules)."
  - "B5 4th: fallback gate was stricter than the plan (cat==_Unsorted_Review AND conf==0) → 39 folders landed in review. Aligned to the plan (fires when cat==_Unsorted_Review OR conf==0) while excluding entries flagged by our own nest guard (_nest_flagged)."
  - "B5 tech-debt (NOT fixed, out of scope): folder category_path is never validated against the taxonomy (files are, via resolve_category) — the first fixed run emitted an impossible 'Media/Archives'."
  - "B5 deviated from plan: make_review_move() lives in sorter/folder_classifier.py (testable module) rather than sort.py, where it would need a test harness around main()."