## SESSION 8b — medium-word folder naming
## ─────────────────────────────────────────────────────────────
THE_PRINCIPLE: >
  A folder named only after the MEDIUM (Bilder, pics, Fotos) carries NO SUBJECT.
  There is nothing to classify. Route it by OWNER / EVENT / DEPICTED-SUBJECT
  instead, and let the children dissolve flat into the category.

VERIFIED_TARGETS (live dry-run, 3273 files — all 6 correct):
  Tina/bilder        -> Media/Photos/Tina
  zenos bilder       -> Media/Photos/Zeno
  Realtreffenpics    -> Media/Photos/Real Life Treffen
  Eigene Bilder      -> Media/Photos/Eigene
  Char Bilder        -> Zeno/Documents/Design/Chars
  bilder&screens     -> dissolve flat into Media/Photos/

SPLIT_OF_AUTHORITY — THE KEY ARCHITECTURAL DECISION:
  model owns the CATEGORY; code owns the LEAF.
  - The model classifies these folders CORRECTLY but emits the own_target boolean
    only 5/15, later 7/15 of the time.
  - Without own_target, resolve_folder_move injects SOURCE ANCESTRY TWICE, yielding
    paths like Media/Photos/Projekt Müller/Angebot/Gruppe 1/Bilder — technically
    "correct" per the taxonomy, useless to a human.
  - Therefore the leaf NAME is COMPUTED in code (medium_word_target); own_target is
    honoured only when the model actually sets it.

THE_BLOCKER_WAS_THE_CODE_LAYER:
  Feeding the computed targets through the EXISTING resolve_folder_move gave 5/5
  WRONG. No amount of prompt wording could fix this — the resolver was rewriting
  correct targets. Lesson 008-04.

HARMFUL_RULE_REMOVED:
  "prefer Design when unsure" (added 8a batch 2) misrouted Eigene Bilder and
  zenos bilder into Design — they are photos, not artwork. Lesson 008-05.

REGRESSION_GUARD: Rammstein 2010 (music) no longer misrouted to Videos.

NEW_TESTS: tests/test_medium_word_deterministic.py, tests/test_medium_word_naming.py

