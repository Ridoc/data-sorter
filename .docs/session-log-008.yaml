## SESSION 8c — undo-dissolve-safety (batches 1-4)
## ─────────────────────────────────────────────────────────────
THE_CATASTROPHE_THAT_WAS_FIXED:
  `--undo` after a dissolve ran shutil.move(Media/Photos, .../bilder&screens) —
  it would have RELOCATED THE USER'S ENTIRE PHOTO LIBRARY.
  Cause: ONE aggregate folder_move row whose target_path was the SHARED CATEGORY
  directory, and reverse_move treated ANY non-delete action as a directory move.
  A single row carried authority over a whole category.

BATCH_1 — per-file undo rows everywhere
  - _dissolve_folder returns per-child records (pre-move hash, post-collision
    target) so each moved file gets its OWN undo row; a partial failure no longer
    voids the whole batch.
  - folder_move_records() does the same for whole-folder moves, in BOTH
    execute_moves and the --execute batch path in sort.py — the --execute path
    NEVER honoured _dissolve at all.

BATCH_2 — reverse_move action whitelist (sorter/undo.py:60-66)
  - ONLY "move" and "delete" are reversible. Aggregate rows ("folder_move",
    "dissolve_summary") are REFUSED with a warning, not reversed.
  - Trace rows still get written so the operation is auditable.

BATCH_3 — SECURITY: undo CSV treated as UNTRUSTED INPUT
  undo_last_run's nas_root was a DEAD parameter. The undo CSV lives at a FIXED
  append-only path, so ANY row in it — including a planted one — could previously
  move files ANYWHERE on the system, not just under the NAS root.
  FIXED:
  - _within_root containment on BOTH ends: target_path AND source_path.
  - source_path.parent also checked: the collision-bump case resolves to <root>_1,
    which sits OUTSIDE the root.
  - empty/"." source paths rejected — they raised an uncaught ValueError that
    ABORTED THE ENTIRE UNDO RUN (one malformed row = total loss of rollback).

BATCH_4 — collision hoisted so mover and recorder cannot disagree
  _move_folder resolved a name collision into a LOCAL variable and returned only
  bool, so folder_move_records logged the INTENDED target. On a clash that path
  never existed, so --undo could not find the folder and it was STRANDED at the
  bumped name (collide/X_1/moved.txt).
  FIX: collision resolution hoisted into resolve_dir_target() (executor.py:17),
  called by the mover AND the record builder. _move_folder returns the actual Path.

BATCH_5/6 — derived-name safety + category-stable refinement
  - Code-derived names are flagged _derived, confidence CAPPED TO 70 (review band,
    not auto-accept), EXCLUDED from --execute auto-approval (sort.py:1155), and
    shown as "⚠️ [derived]" (sort.py:1126) with a count in the READY summary.
    An auto-named folder must be EYEBALLED, not silently applied.
  - The medium-word refinement re-ask runs on a ~15x smaller batch than the main
    pass and therefore has a WEAKER view of the taxonomy: it may refine the NAME
    but NEVER re-route. A disagreeing category keeps the FIRST pass and is
    reported ("⚠️ category disagreement, kept first pass", sort.py:480-487).
  - NEW WARNINGS: warn_medium_like_unmatched (sort.py:295) surfaces folder names
    that LOOK medium-word but missed the exact-shape gate (e.g. "Bilder (alt)"),
    so the rules' blind spots are visible instead of silent.

