## SESSION 8a — design-routing-fix
## ─────────────────────────────────────────────────────────────
plan_spec: plan-spec-design-routing-fix.yaml   # ARCHIVED (deleted from repo root per lifecycle)
batches: 5, all [x]

ROOT_CAUSE_CHAIN: >
  Design folders (Entwuerfe Logo, BO/BRB/FC Logo, Grafik fuer Videos, ID-Cards)
  kept landing in Media/Photos. Fixing the prompt alone did nothing, because FOUR
  independent bugs were stacked behind it. Each mask had to be removed before the
  next one became visible.

BATCH_1 — dominant-type override demoted to LLM-FAILURE fallback
  - _apply_dominant_fallback (sort.py) no longer overrides a confident OR a
    low-confidence LLM verdict; it fires ONLY when the LLM failed/abstained.
  - WHY: the override re-encoded the exact type-first heuristic session-007's
    subject-first prompt was written to defeat — it silently beat the model.
  - ORDERING: it runs AFTER re-keying (batch 5) so it also covers folders the LLM
    never answered for.
  - Lesson 2026-09-18-subject-over-filetype (prompt side) was INSUFFICIENT: the
    same bias re-entered from the deterministic layer. See lessons 008-01.

BATCH_2 — prompt reinforcement, principle-level, NO keyword lists
  - design assets -> Zeno/Documents/Design; scanned documents -> Documents;
    prefer Design when the NAME suggests artwork/branding/drafts.
  - Principle preserved: let the LLM reason from context; do not hardcode keyword
    lists that will rot.

BATCH_3 — taxonomy + routing surface
  - Design subfolder unified under Zeno/Documents/Design.
  - .prtl (Premiere title overlays) -> Design instead of Media/Videos.
  - The scan ROOT is no longer classified as a folder unit; its files return to
    individual classification instead of being orphaned.

BATCH_4 — failed folders become ONE review unit
  - make_review_move collapses a failed/uncertain folder into a single
    _Unsorted_Review unit instead of scattering children into individual
    classification, which produced garbage (loose .htm -> Projects/ERGO_Paphos).
  - --execute NO LONGER auto-approves review-moves: marked "[REVIEW]" and counted
    separately in the READY prompt (sort.py:1126, count at 1168-1171).

BATCH_5 — dry-run exposed the three masked bugs
  All three below were live routing bugs that 513 passing tests never covered:
  (a) POSITIONAL PAIRING — sort.py zipped folder_entries with folder_classifications,
      but the LLM returns its JSON array in ARBITRARY order. Folders received each
      other's categories. FIX: re-key by the echoed path.
  (b) TRAILING-SLASH ECHO MISMATCH — the LLM echoes "path/" while the entry key is
      "path". Exact-match lookup failed, and the failure path then ran the dominant
      fallback, overriding GOOD verdicts. FIX: .strip().rstrip("/") on both sides.
  (c) SILENT DROPS — folders the LLM omits from large batches were never revisited.
      FIX: one focused retry pass for dropped folders, reusing the SAME
      _build_folder_prompt. WHY same prompt: a bare re-ask made the model guess by
      type (logo folders -> Media/Photos), re-creating bug (a).

