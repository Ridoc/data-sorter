4_TWO_VACUITY_TRAPS_HIT WHILE BUILDING THE TESTS
  - First draft passed only 4 of 9 mutations: fixtures used BRACKET-FREE values, so
    escape(cat)/escape(reason)/escape(suggested) were unobservable at runtime. A
    DRIVEN test can be decorative in exactly the way a static guard is — driving the
    code is not enough if the DATA lacks the property under test.
  - `assert "de" in text` passed even with language detection stubbed to "?" because
    the REASON text also contained "de". Loose substring assertions are satisfied by
    the wrong half of the output.
  - A reviewer's suggested regex fix was itself WRONG — it broke `detected: de` and
    `language detected: es`. Caught by a case matrix, not by review authority.
  - LESSONS: 4 appended (35 -> 39).

5_AUDIT_THE_DEFECT_CLASS_FOUND_A_SECOND_INSTANCE
  - Asking "where else does a regex stand in for a parser it cannot express?"
    located the SAME defect class at sorter/classifier.py:353:
    re.findall(r'\{[^}]+\}', ...) cannot match NESTED braces, so
    {"a":1,"b":{"c":2},"d":3} yields the truncated fragment {"a": 1, "b": {"c": 2},
    which fails json.loads again and the record is SILENTLY DROPPED.
  - Filed OPEN: classifier-json-repair-breaks-on-nested-braces. Audited and REPRODUCED,
    not fixed — outside this session's scope.

