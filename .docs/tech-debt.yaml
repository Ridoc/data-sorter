  - id: log-writes-undo-csv-during-dry-run
    description: >
      log_move (sorter/executor.py:193) has no dry_run guard — it appends to the undo
      CSV unconditionally. In a dry-run pass the rows describe moves that never
      happened, so a subsequent --undo would act on phantom records.
    location: "sorter/executor.py:193-212 (callers at 239,250,270,279,307,332; sort.py:1272-1318)"
    status: open
    confidence: verified
    session: nas-file-sorter-008
    risk_assessment: >
      NOT production-reachable. All three execute entry points short-circuit to
      dry_run_summary (sort.py:680, 1231) BEFORE any log_move call is reached, so a
      pure --dry-run never reaches the writer. Residual risk: a caller added later
      that logs without honouring dry_run would silently poison the undo CSV.
    prevention: "If a new execute path is added, guard log_move on dry_run at the writer."

  - id: undo-leaves-empty-dirs-after-collision-bump
    description: >
      --undo restores a collision-bumped folder (X -> X_1) but never removes the now-empty
      source directory. undo.py contains no rmdir/rmtree, by SAFETY_INVARIANT #1 (never
      hard-delete).
    location: "sorter/undo.py:107-160 (reverse_move / undo_last_run)"
    status: open
    confidence: verified
    session: nas-file-sorter-008
    note: >
      Cosmetic residue, NOT data loss. Intentionally conservative — removing the empty
      dir is safe only if it is empty AND was created by this run, which the CSV does
      not record. Do not 'fix' with an unconditional rmdir; that would violate
      SAFETY_INVARIANT #1.

