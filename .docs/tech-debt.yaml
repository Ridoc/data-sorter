  - id: tmp-wiped-mid-session
    scope: agent-toolchain
    fact: >
      /tmp was wiped TWICE during session 009, destroying dryrun-final3.txt once and the
      git dir (a --separate-git-dir lives at /tmp/data-sorter-git per lessons
      2026-09-17-cifs-git-tmp) once.
    impact: "Lost comparison artifacts; one near-miss on version-control state."
    prevention: >
      Do NOT rely on /tmp or /tmp/opencode for anything that must SURVIVE the session —
      not comparison artifacts, not the separate git dir, not intermediate baselines.
      Copy artifacts next to the repo (or another persistent volume) before relying on
      them. Note the tension with lessons 2026-09-17-cifs-git-dir: the git dir must be
      OFF the CIFS mount, but /tmp is not durable — pick a persistent local-disk path
      (e.g. ~/.cache or ~/.venvs sibling), not /tmp.

