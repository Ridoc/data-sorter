## COST TRADEOFF (key insight)
nomic-embed-text embeddings ~= 100x cheaper than qwen2.5-coder:7b LLM tokens.
Centroid pre-filter absorbs the bulk of classification (high-similarity files);
LLM only runs on the residual unmatched set. 768-dim cosine over folder centroids
is a strong proxy for "does this belong here?" without full generation.

