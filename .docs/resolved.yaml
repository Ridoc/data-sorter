      that already contain escape(), it collects every console.print / Table.add_row site
      and asserts user data interpolated without escape(). Validated by mutation testing:
      7/7 mutations caught, control green.
    confidence: verified
    note: >
      Closing this debt is what makes the successor lesson load-bearing: the FIRST guard
      collected only statements that already had escape(), so DELETING an escape() made
      the statement drop out of the set and the regression passed silently — the suite
      stayed fully green with escape() stripped from the gate's tgt_rel. A guard that
      only asserts a property is PRESENT passes forever unless it has been observed
      FAILING when that property is REMOVED. See lesson
      2026-10-03-guard-that-checks-presence-only-is-vacuous.
      Companion entry, deliberately NOT closed by this commit: classify-progress-display-branch-untested
