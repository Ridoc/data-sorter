  - id: retry-attempts-not-wired
    resolved_in: nas-file-sorter-009 (commit cd4856e)
    description: >
      retry_attempts: int = 2 was an OllamaClient constructor default that was never in
      config.yaml, never passed by from_config, and never read by any retry path — dead
      config advertising a retry budget the code did not have (classify_batch halving
      via _retry_with_smaller_batches, no attempt limit).
    resolution: >
      REMOVED rather than wired: the constructor param is deleted and so is the
      unreachable post-`return` block in _retry_with_smaller_batches. The recursive
      halving behaviour is unchanged. tests/test_classifier.py::
      test_retry_attempts_dead_config_removed pins that the param is neither in the
      signature nor an attribute of OllamaClient, so it cannot creep back unwired.
    confidence: verified
    note: >
      Removal, not wiring, is deliberate: classify_batch's halving retry has no attempt
      budget, and inventing one would change LLM call volume on a NAS-scale batch.
      The old debt line refs (classifier.py:58,67,98-102) are stale by design.

