1_THE_GATE_REFUSED_FIRST_AND_WAS_NOT_OVERRIDED   # process fact, kept verbatim
  - The security-reviewer gate initially REFUSED to run. The cause was a TORN tier
    state file: tier=DEGRADED while degraded=false, hard_block_reason absent, and
    dead_tiers={}. That combination is one the plugin's own writers cannot emit —
    a half-written state, not a real degradation.
  - The refusal was NOT overridden or worked around. A fresh coherent probe was
    taken (tier=PAID, degraded=false, hard_block_reason=null) and the gate was RE-RUN
    on that state. Same inputs, different verdict — which is the proof the first
    refusal was an artefact of stale state rather than a judgement about the diff.
  - LESSON (iii) appended below: a gate refusal clears on a fresh coherent probe,
    not on a restart. Restarting the session would have discarded the pending work
    and changed nothing about the state that actually caused the refusal.

2_LOW_1_FIXED_reason_null_ABORTED_MID_CLASSIFICATION   # the only code change this session
  - FINDING (LOW, pre-existing — NOT a regression introduced by this batch):
    sort.py:673 read the LLM's reason field as `result.get("reason", "")`.
  - THE DEFECT: `dict.get`'s default fires only when the key is ABSENT. The Ollama
    classifier emits explicit JSON, and `"reason": null` is a key that IS present —
    so .get() returned None, re.search(pattern, None) raised TypeError, and the run
    aborted part-way through classification. A missing key was handled; an explicit
    null, which is the more natural thing for a model to emit for "no explanation",
    was not.
  - SHIPPED: `or ""` instead of the default argument. Same intent, different
    mechanism: `or` fires for BOTH absent and null, which is what an LLM payload
    needs and what .get() does not promise.
  - Covered by a `(None, "?")` case added to the EXISTING parametrize matrix in
    tests/test_classify_display.py — no new test file, no new fixture: the matrix
    already existed and this is one more row of the same shape.

3_LOW_2_FIXED_INDEX_UNDERCOUNTED_OPEN_DEBT
  - index.yaml claimed "15 entries" for open tech-debt; the parsed count was 16.
    AGENTS.md already said 16 and was correct — the drift was isolated to the router,
    which is exactly the file a routing agent trusts without re-reading.

4_THE_TEST_COUNT_WENT_STALE_THREE_TIMES   # process, not a code defect
  - 554 -> 562 -> 563 across this batch, each time a claim was copied forward instead
    of measured.
  - The reconciliation rule adopted for the rest of this session: PARSE, never grep.
    yaml.safe_load for debt/resolved/lesson counts, pytest --collect-only for test
    counts. Grepping for a number in prose finds the number, not the truth, and the
    three stale figures prove the copy-forward habit was operating unchecked.

5_THE_MUTANT_VERIFICATION_WAS_WRONG_THE_FIRST_TIME   # methodological, see lesson (ii)
  - Verifying that the `or ""` fix is load-bearing requires a mutant. My first mutant
    appeared to PASS verification — but bash quoting ate a parenthesis, so the mutant
    raised SyntaxError during collection. The mutant was malformed; it was never
    parsed as Python at all, let alone executed.
  - A mutant that fails to PARSE proves nothing about whether the mutation was caught.
    Reading the failure reason is mandatory: SyntaxError/collection error = broken
    harness, TestFailed/AssertionError = real kill.
  - Redone via heredoc. The corrected mutant parses, and it genuinely fails
    test_language_detection_shapes[None-?] — which is the only thing that makes the
    new test case worth having.

