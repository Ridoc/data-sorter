2_REAL_BUG_FOUND_BY_COVERING_THE_GATE   # highest-value item of the session
  - The listing prints through Rich, which parses `[...]` as MARKUP. "⚠️ [derived]" was
    consumed as a style tag and SILENTLY DROPPED: a derived folder rendered as
    "⚠️  Scans/...". The warning session-008 BATCH_3 added to stop silently auto-named
    folders NEVER APPEARED ON SCREEN — the feature was inert in production.
  - "[REVIEW]" survived by LUCK only: Rich's tag regex requires a LOWERCASE first char.
  - Data-side twin: a folder literally named "[bold]Album" rendered as "Album" — the
    user was consenting to a different name than the one displayed.
  - FIX: rich.markup.escape() on prefix, source AND target (sort.py:730 import).
  - LESSON: 2026-10-03-markup-eats-user-strings (escape user strings; assert on
    RENDERED OUTPUT, not on the source expression — the label was in the source all along).

