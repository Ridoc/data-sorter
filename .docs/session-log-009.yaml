  FIX (76dc175): >
    Escaped every name-bearing interpolation in sort.py: file-review listing (~650/652/
    654), cohesive-folder scan (~849), dissolve listing (~914/917), _Unsorted_Review
    unit line (~932), pre-gate summary tables (~1125/1127 and the folder-moves table).
    Proven, not theorised: a folder literally named "[bold]Album" rendered as "Album",
    because Rich parses bracket pairs as markup.

  REAL BUG FOUND DURING THE FIX (the important one): >
    escape was first imported only inside main(), but THREE escape() call sites live in
    _classify_with_progress — a DIFFERENT function. Python resolves names per-function,
    so this would raise UnboundLocalError the first time that display branch ran. NO
    test could catch it: grep of tests/ shows _classify_with_progress is referenced by
    ZERO tests (verified). Caught by a static AST check — every function using escape()
    must contain "from rich.markup import escape" — then fixed by binding per-function.
    The project convention is that rich is deliberately NOT imported at module level in
    sort.py (lazy by design), so per-function binding is the correct form, not a bug.

