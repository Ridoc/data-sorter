BATCH 2: Subject-first prompt instruction (sort.py + sorter/classifier.py)
  - sort.py _classify_folder_prompt (~line 132): Added 3 rules to the folder prompt:
    (a) "Classify by SUBJECT first (folder/filenames reveal purpose), NOT by dominant file type."
