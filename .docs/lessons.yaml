- id: 2026-10-03-concurrent-writer-invalidates-gate-results
  domain: process/vcs-discipline
  root_cause: >
    A second, UNIDENTIFIED writer committed to this repo for the whole architect-followup
    session. Commits 0c0e569 (10:40) and cd4856e (10:54:54) are authored "Zeno (Librarian
    Sync)" and carry BOTH the build agent's work AND edits that no admitted agent authored
    (an escape() fix inside sort.py's gate loop; an AST re-scope in
    tests/test_derived_wiring.py replacing MAIN with SCOPE = TREE). A session-close
    subagent also ran unrequested and wrote session-log-009.yaml plus tech-debt /
    resolved / index / lessons edits mid-flight, and a stray 0-byte .venv/ skeleton
    appeared at repo root — the CIFS Errno 95 failure mode AGENTS.md warns about — which
    76dc175 had to remove again. The gates could not see any of this: qa-tester and
    security-reviewer pin a tree snapshot, so a commit landing WHILE a gate runs
    invalidates that pin, and both gates had to be re-run. The trap generalises past this
    repo: git log is not an authorship record of YOUR work, and a green gate is a
    statement about ONE commit's tree, not about the tree as it stands when you read it.
  prevention: >
    (1) A gate result is valid ONLY for the tree it pinned. Before trusting qa-tester /
    security-reviewer output, run `git status --porcelain` and `git log -1 --format=%h`
    and confirm HEAD is still the commit you gated; if either moved, RE-RUN the gate —
    never present a stale pass as current. (2) Before writing "fixed in commit X" or
    attributing work, run `git log -5 --format='%h %an %s'` and READ the author field:
    never assume a commit in the log was authored by the current agent. Unexplained
    authorship is a signal that another writer is live, not a formality. (3) Have gates
    record the commit sha they pinned INSIDE their report, so snapshot drift is
    detectable instead of silent. (4) A stray .venv/ on this CIFS mount is never a
    mystery — it is the Errno 95 symptom and proof that something ran a venv command
    in-repo; the only sanctioned interpreter stays ~/.venvs/data-sorter. (5) Memory
    written by an uninvoked subagent is authoritative as CONTENT but unverified as
    PROCESS — re-verify counts against the tree before letting it stand as the record.
  session: nas-file-sorter-009
  confidence: verified

- id: 2026-10-03-guard-that-checks-presence-only-is-vacuous
  domain: testing/guards
  root_cause: >
    The FIRST version of the Rich-escape lint guard collected only those AST statements
    that ALREADY contained `escape(`, then asserted escape() was present in each one. That
    direction is vacuous with respect to the regression it exists to catch: DELETING an
    escape() call removes the statement from the collected set entirely, so the assertion
    never sees it. PROVEN, not argued — stripping `escape(` from the gate's tgt_rel left
    the whole suite FULLY GREEN, i.e. the guard passed on the exact defect it was written
    to prevent. The failure is structural, not a typo: "enumerate the instances of a
    property, then assert the property holds" can only ever fire when a NEW bad instance
    is added that still matches the collection predicate — which, when the predicate IS
    the property, is unreachable. Enumeration and assertion must use DIFFERENT predicates.
  prevention: >
    (1) Invert the direction: collect the MANDATED call sites (every console.print /
    Table.add_row) from the AST, THEN assert each one escapes its user data. The
    collection predicate must be able to select a violating instance.
    (2) MUTATION-PROBE every guard before trusting it: remove the property it claims to
    enforce and confirm the suite goes RED. The fixed guard was validated 7/7 mutations
    caught with the control green. A guard that has never been OBSERVED FAILING is not
    evidence of anything — same class as an undriven branch (see
    2026-10-03-lazy-import-bound-in-wrong-function) and as
    2026-10-03-vacuity-fix-creates-new-vacuity, where a PARTIAL fix was still vacuous.
    (3) Treat "the suite is green" after a deliberate break as a FAILED experiment that
    succeeded; never as evidence the break was harmless.
  session: nas-file-sorter-009
  confidence: verified
- id: 2026-10-03-fixtures-must-carry-markup-to-be-observable
  domain: testing/vacuity
  root_cause: >
    A DRIVEN test can be decorative in exactly the way a static presence-only guard is.
    My first draft of tests/test_classify_display.py passed only 4 of 9 mutations,
    because every fixture value was bracket-free ("Photos", "Holiday pics"). With no
    `[` in the data, escape(cat) / escape(reason) / escape(suggested) are no-ops at
    runtime: every mutation that removed or misplaced an escape() call produced
    byte-identical output, so the tests could not possibly catch it. The assertions
    looked reasonable and the branch was genuinely executed — driving the code was
    simply not sufficient, because the DATA lacked the property under test. This is
    the same structural error as 2026-10-03-guard-that-checks-presence-only-is-vacuous
    one level up: the test collected evidence from a set that cannot contain a
    counterexample.
  prevention: >
    (1) When a test's purpose is to prove a TRANSFORMATION, make sure the fixtures
    carry the INPUT that the transformation exists to neutralise. A bracket-free
    fixture cannot observe bracket escaping; a fixture with no quotes cannot observe
    quote handling; a fixture with no unicode cannot observe an encoding guard.
    (2) Ask of every escaping/sanitising assertion: "what would this print if the
    escape were deleted?" If the answer is "the same string", the fixture is wrong,
    not the assertion.
    (3) Treat a low mutation-kill rate as a FIXTURE defect first and an assertion
    defect second. 4/9 was interpreted correctly only because the mutation run had
    already been done — without it, the draft would have shipped as "covered".
  session: nas-file-sorter-010
  confidence: verified

- id: 2026-10-03-loose-substring-assertions-hide-defects
  domain: testing/assertions
  root_cause: >
    `assert "de" in text` passed even when language detection was stubbed to return
    "?" — because the rendered REASON text also contained the substring "de"
    (in "detected"/"defined"). The assertion was satisfied by the wrong half of the
    output. A substring assertion is a claim about "somewhere in this blob"; the
    behaviour under test is a claim about "this specific rendered field". Any
    assertion loose enough to be satisfied incidentally will be, whenever the
    incidental source happens to contain the fragment.
  prevention: >
    (1) Pin the field, not the fragment: assert on the FULL parenthesised rendered
    value `(lang: de)` rather than `"de"`, so the assertion cannot be satisfied by
    neighbouring text.
    (2) When asserting on rendered/prose output, prefer an ANCHORED match that binds
    the value to its label, and make the stub values mutually distinguishable — if
    every stub can return the same token, the assertion carries no information.
    (3) Generalisation: for each assertion ask WHICH LINE/MERGE made it pass. If the
    answer is "more than the one under test", it is a decorative assertion.
  session: nas-file-sorter-010
  confidence: verified

- id: 2026-10-03-reviewer-suggested-fix-can-itself-regress
  domain: review/change-control
  root_cause: >
    A test reviewer's suggested fix for the lang-code regex was itself WRONG: it broke
    `detected: de` and `language detected: es`, two phrasings the shipped regex
    handles. Review authority is not correctness evidence — the suggestion was
    confidently reasoned and still regressed two inputs, and it would have passed any
    check that only re-ran the tests written against the NEW behaviour. The failure
    mode is trusting the proposer's intent instead of the proposer's OUTPUT.
  prevention: >
    (1) Never accept a regex/logic change on review authority alone. Run a CASE MATRIX
    of old-vs-new across every input phrasing the feature must handle, and diff the
    outputs — the same differential that proved the fix is a pure move
    (2026-10-03-prove-pure-moves-by-differential) proves the replacement equivalent.
    (2) Zero behavioural difference across the matrix is the PASS condition; anything
    else is a regression regardless of how the reviewer phrased it.
    (3) Extend the matrix to the phrasings the reviewer did NOT mention: reviewers
    reason about the case they are looking at, which is where the holes are.
  session: nas-file-sorter-010
  confidence: verified

- id: 2026-10-03-audit-the-class-after-fixing-a-bug
  domain: debugging/generalisation
  root_cause: >
    After the lang-regex defect was fixed, asking "where else does a regex stand in
    for a parser it cannot express?" found the SAME defect class at
    sorter/classifier.py:353 within minutes: `re.findall(r'\{[^}]+\}', ...)` cannot
    match NESTED braces, so a reply like `{"a":1,"b":{"c":2},"d":3}` yields the
    truncated fragment `{"a": 1, "b": {"c": 2}`, which fails json.loads again and is
    silently DROPPED. Fixing the instance without auditing the class leaves a known
    live bug of the same shape sitting in the next file, now with a documented
    precedent for why nobody questioned it.
  prevention: >
    (1) After fixing a bug, spend one search asking what ELSE shares its defect
    CLASS, not just its string. The class here is "regex used as a parser where the
    real grammar needs balanced-delimiter or context-free matching".
    (2) File what the audit finds as OPEN debt with a REPRO (`re.findall` on a nested
    payload), not as a vague "check similar code" note — an unreproduced suspicion
    decays into nothing within a session.
    (3) Prefer RAISING over silent partial parses in recovery paths: a swallowed
    parse error that returns a short list is indistinguishable from "nothing to do",
    which is how a dropped record stays invisible to the user.
  session: nas-file-sorter-010
  confidence: verified