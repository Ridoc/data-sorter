## LLM INTERFACE

### Prompt Template (fixed for KV cache reuse)

```
You are a NAS file organizer. Given a file's metadata and content:

FILE: {filename}
TYPE: {mime_type}
SIZE: {size_bytes}
DATE: {modified_date}
CONTENT: {extracted_text[:2000]}

Existing folder structure on this NAS:
{taxonomy_yaml}

Rules:
- Return JSON: {{"category_path": "path/from/root", "confidence": 0-100, "reason": "short"}}
- category_path must start with one of the top-level folders above
- If no existing category fits → propose a new subfolder under the best-matching top-level
- confidence > 85 = auto-suggest, 50-85 = flag for review, < 50 = send to _Unsorted_Review
- For Adobe Premiere temp files (Auto-Save, PRV files) → category_path "DELETE"
```

### Optimization (from community notes)
- **Batch inference**: Send 10-20 files per Ollama request → reuse KV cache for repeated system prompt
- **Parallel extraction**: Use ThreadPoolExecutor for content extraction (I/O bound)
- **Confidence threshold**: configurable in config.yaml (default 85/50)

