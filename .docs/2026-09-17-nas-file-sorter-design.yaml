## FILE SCANNER

| Feature | Behavior |
|---------|----------|
| Walk | `os.walk` recursive, respects `.sortignore` |
| Ignore | `OpenCode/`, `.git`, `.Trash-*`, `#recycle`, `@eaDir`, `Thumbs.db`, `.DS_Store` |
| Depth | configurable max-depth (default = unlimited) |
| Detection | `python-magic` for MIME type; extension fallback |

## CONTENT EXTRACTION

| File type | Extractor | Data used |
|-----------|-----------|-----------|
| PDF | markitdown | full text |
| DOCX/XLSX/PPTX | markitdown | full text |
| Images (JPG, PNG, HEIC) | Pillow + exiftool | EXIF date, GPS, camera model |
| Videos (MP4, MOV, AVI, WMV) | ffprobe | creation date, codec, duration, resolution |
| Audio (MP3, WAV, FLAC) | ffprobe | artist, album, duration |
| Plain text / code | read first 2KB | shebang, content hints |
| Binary/unknown | stat only | size, date, extension |

## DEDUPLICATION

| Feature | Scope |
|---------|-------|
| **Exact duplicates** | SHA-256 content hash — same file content at different paths |
| **Image near-duplicates** | Perceptual hash (`imagehash` + Pillow) — resized/recompressed photos |
| **Deletion method** | Move to staging trash folder `Archives/_Duplicates_Delete/` — never hard delete |
| **Preference** | Keep newest `mtime`, flag older copy for deletion |
| **Review** | Shown in TUI alongside classification results — user approves/rejects per duplicate pair |

Dedup pass runs AFTER classification (scans all target folders for hash collisions).

## SAFETY

- **Dry run is MANDATORY** — never moves a file without user preview
- **CSV undo log** — every move logged with: `timestamp,original_path,target_path,confidence,file_hash`
- **Undo command** — `sort.py --undo` reads CSV, reverts all moves (file hash verified for collision detection)
- **Adobe Premiere temp** — flagged for deletion (auto-saves are safe to remove; preview files regenerate)

## CLI USAGE

```bash
# Full run (dry preview → confirm → execute)
python sort.py

# Undo last run
python sort.py --undo

# Resume interrupted run
python sort.py --resume

# Skip interactive mode (only if you've already reviewed)
python sort.py --execute

# Dry run only (just preview, no move)
python sort.py --dry-run

# Custom config
python sort.py --config my-config.yaml
```

## PROJECT STRUCTURE

```
data-sorter/
├── sort.py                    ← entry point
├── config.yaml                ← taxonomy, ignore list, Ollama endpoint, thresholds
├── .sortignore                ← git-styled ignore patterns (OpenCode/, .Trash-, @eaDir)
│
├── sorter/
│   ├── __init__.py
│   ├── scanner.py             ← file walker + ignore matcher
│   ├── extractor.py           ← content/metadata extraction per type
│   ├── classifier.py          ← Ollama client, batch inference, KV cache
│   ├── taxonomy.py            ← category matcher (YAML + LLM suggestions)
│   ├── reviewer.py            ← Rich TUI interactive review
│   ├── deduper.py            ← SHA-256 + perceptual hash dedup scanner
│   ├── executor.py            ← file mover + CSV logger
│   └── undo.py                ← CSV reader + reverse mover
│
└── requirements.txt
```

## MODEL

| Aspect | Decision |
|--------|----------|
| Primary | `qwen2.5-coder:7b` via Ollama REST API (`localhost:11434`) |
| Fallback | `qwen2.5:1.5b` (lighter, faster for simple extension-based classification) |
| Embedding | `nomic-embed-text` — perceptual hash for image near-duplicate detection |

## OUT OF SCOPE (v1.0)

- Continuous watch mode (future)
- Web UI (future)
- Cloud LLM providers (explicitly excluded — local-only)
- Git integration / versioning (undo log covers this)
- Duplicate file merging deferred (v1.0 has dedup detection + staging trash)