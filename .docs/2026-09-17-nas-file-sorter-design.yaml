## OVERVIEW

CLI tool that scans NAS mount `/mnt/NAS-Zeno/`, classifies files via local Ollama (`qwen2.5-coder:7b`), presents interactive TUI review (Rich/Questionary), then moves files with CSV undo log.

## CORE STACK

| Layer | Tech | Why |
|-------|------|-----|
| Lang | Python 3.11+ | de facto for LLM tooling, rich ecosystem |
| TUI | `rich` + `questionary` | colored trees, confidence indicators, accept/reject/modify per item |
| LLM | Ollama REST API (`qwen2.5-coder:7b`) | local, 32K context for batch, ROCm GPU accelerated |
| Extraction | `markitdown` (docs), `ffprobe` (video), `Pillow` (image EXIF), `python-magic` (mime) | |
| Config | YAML | human-editable taxonomy + ignore patterns |

