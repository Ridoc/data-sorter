## BATCHES COMPLETED

BATCH 1: Extension routing module (sorter/routing.py)
  - route_by_extension(filename, rel_path) -> (category, confidence, reason)
  - Deterministic extension->category map: py,js,ts,go,rs -> Projects;
    pdf,docx -> Documents; jpg,png,mp4 -> Media (subfolder resolved later by LLM)
  - Path-context guard: if rel_path starts with Projects/, Zeno/, Media/, Family/,
    Company/, Archives/ -> return None (skip routing, preserve project affiliation)
  - Returns None if no extension match or path-context guard fires.
  - sorter/routing.py:1-120.

BATCH 2: Routing tests (tests/test_routing.py)
  - 20 tests: 12 extension routing (known exts -> correct category),
    4 path-context guard (files under Projects/ Zeno/ Media/ skip routing),
    2 duplicate-suffix + 2 no-extension edge cases.
  - All pass with 0 live Ollama required.

BATCH 3: Classifier determinism + perf (sorter/classifier.py)
  - batch_size: 15 -> 8 (smaller batches improve latency; KV cache already lost per batch)
  - ollama options: temperature=0, seed=42 (kills non-determinism in LLM classification)
  - Content extraction SKIP for non-text MIME types (archives, binaries, images, video)
    -> skips ~90% of files from expensive markitdown/Pillow/ffprobe extraction
  - JSON repair: try json.loads, on failure attempt regex repair (extract first {...}),
    then recursive halving fallback only if repair fails
  - text_preview: 500 -> 200 chars (reduces prompt tokens, sufficient for LLM classification)
  - classify_batch retry path preserved but now deterministic (same input -> same output)

BATCH 4: sort.py pipeline integration
  - Extension routing pre-classifier: BEFORE LLM classification, run route_by_extension
    on each unorganized file -> route-matched files removed from LLM batch entirely
    (same pattern as centroid pre-classifier L491-572 from session-004)
  - Self-nesting guard in folder classifier: cascade_block check — if target_folder
    is inside source_folder path tree -> block the move (prevents file nesting in itself)
  - Dominant-type override: if folder has 50%+ files of same media kind (text/image/video/
    audio), pin category to that dominant type regardless of LLM suggestion
  - Copy-suffix dedup wiring: after classification, run find_copy_duplicates() on target
    folders -> detect name vs name (2).ext collisions -> rename or flag for review

BATCH 5: Deduper copy-suffix detection (sorter/deduper.py)
  - find_copy_duplicates(files) -> list of (original, copy) pairs
  - Pattern: "name.ext" vs "name (2).ext" vs "name (3).ext" (Windows/macOS copy suffixes)
  - NOT content-hash based — structural/syntactic match on filename pattern
  - Used for review UI: shows copy-suffix pairs alongside SHA-256 duplicates

BATCH 6: Folder classifier dominant media kind (sorter/folder_classifier.py)
  - format_folder_for_prompt now prepends "Dominant media kind: {kind}" line
    derived from majority MIME type in the folder
  - Gives LLM deterministic grounding for folder-level type decisions
  - Prevents LLM from mis-routing a text-heavy folder into Media/ or vice-versa

BATCH 7: config.yaml + README + tests
  - config.yaml: ollama: {model: qwen2.5-coder:7b, batch_size: 8, temperature: 0, seed: 42}
  - README.md: test count 306 -> 326; batch_size 15 -> 8; routing.py added to architecture
