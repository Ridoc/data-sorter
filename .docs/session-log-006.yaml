## BATCHES COMPLETED

BATCH 1: Folded-ancestors context preservation (sorter/folder_classifier.py + tests)
  - _is_junk_segment(name): drops junk path segments from ancestor context — temp dirs,
    system markers (._-), len<=2, old_* prefix. Does NOT filter by _dir_has_meaningful_name
    (short names like "EVE" are legitimate ancestor context).
  - meaningful_ancestors(rel_path, leaf_name, scan_root): extracts meaningful ancestor
    segments from a folder's relative path, dropping junk + scan_root + leaf.
    Example: "Diverse Daten/EVE/-Y-/old_G_files/bilder&screens"
      -> ['EVE']  (scan_root="Diverse Daten", leaf="bilder&screens")
  - resolve_folder_move() rewrite:
    (a) Includes meaningful ancestors in target path: cat_path/ancestors/leaf
        e.g. EVE/.../bilder&screens -> Media/Photos/EVE/bilder&screens
    (b) Normalized name comparison: underscore=space, case-insensitive, hyphen=space
        prevents double-append when LLM already includes leaf name
        e.g. SQ_Tutorials vs SQ Tutorials -> match, no double-append
  - Tests: 9 new in TestMeaningfulAncestors (eve_example, school_path, no_scan_root,
    no_ancestors, all_junk, single_meaningful, multiple_segments, eve_simple,
    short_segments_removed). All pass.
  - sorter/folder_classifier.py:37-99, 215-261.

BATCH 2: Delete protection + 3D/dictation routing (sorter/routing.py + tests)
  - _DELETE_PROTECTED_EXT: set of extensions that are ALWAYS user content — never
    safe to auto-delete. Includes 3D models (.skp, .skb, .dwg, .dxf, .3ds, .blend,
    .obj, .fbx, .max, .c4d, .stl, .step, .iges) + design/image sources (.psd,
    .pspimage, .xcf, .ai, .psp, .svg, .bmp, .tiff, .png, .jpg/.jpeg, .gif, .mp3, etc.).
  - should_protect_from_delete(filepath): returns True if file's extension is in
    _DELETE_PROTECTED_EXT (case-insensitive). Temp/generated files (.tmp, .exe, .msi,
    .rar, .db) return False.
  - route_by_extension new extensions:
    - .dss, .nri, .mcx -> Media/Music (dictation/audio formats)
    - .skp, .skb, .dwg, .dxf, .3ds, .blend, .obj, .fbx, .max, .c4d -> Zeno/Documents/Design
    - .pps -> Zeno/Documents
  - Tests: 5 new (Test3DRouting: 2, TestDeleteProtection: 3). All pass.
  - sorter/routing.py:67-84, 172-177 (delete protection set + function).

