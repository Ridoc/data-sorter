# plan-spec-language-preservation.yaml
# Goal: Folder/file names keep their original language (German/Greek/English) in destination paths.
# Only top 1-2 taxonomy levels use the primary language (English). No migration.
---
plan_name: "language-preservation"
status: approved
created: "2026-09-18"
batches:
  - id: 1
    title: "Language-preservation rule in folder classification prompt"
    status: "- [x] done"
    subagents:
      - name: "build"
        action: "edit sort.py _classify_folders prompt"
        details: |
          Add MANDATORY rules to prompt (sort.py ~line 132-144):
          - "MANDATORY: The last destination segment of category_path MUST be the source folder's own name (verbatim, original language). NEVER translate or anglicize German/Greek folder names."
          - "If a new subfolder is needed for non-English content, name it in the source content's language (e.g. for German 'Entwürfe Logo' use 'Entwürfe_Logo', never 'Design' or 'Logo_Drafts')."
          - "Only the top 1-2 taxonomy levels (Zeno/Documents, Media/Photos etc.) may be in the primary (English) language."
          - "When in doubt about language, keep the source folder's exact name."
    complexity: "simple"
    files:
      - "sorter/sort.py"
    verify: "python -c 'from sort import _classify_folders; print(\"ok\")'"

  - id: 2
    title: "Language-preservation rule in file classification prompt"
    status: "- [x] done"
    subagents:
      - name: "build"
        action: "edit PROMPT_TEMPLATE in classifier.py"
        details: |
          Add to PROMPT_TEMPLATE (classifier.py ~line 93-99 area):
          - "MANDATORY: File names must NEVER be translated. Keep original language. If a new subfolder is needed for German/Greek/etc content, name it in the source content's language."
    complexity: "simple"
    files:
      - "sorter/classifier.py"
    verify: "pytest tests/ -q --tb=line -x"

  - id: 3
    title: "Deterministic language guard — sorter/language.py + wiring"
    status: "- [x] done"
    subagents:
      - name: "build"
        action: "create sorter/language.py + wire into resolve_folder_move"
        details: |
          Create sorter/language.py:
          - detect_language(name: str) -> Literal["de", "el", "en", "other"]
            Heuristic: umlauts (ä/ö/ü/ß) -> de; Greek chars (α-ω) -> el; else en/other
          - leaf_language_mismatch(leaf: str, source_name: str) -> bool: True if LLM returned
            a leaf in a different language than the source folder name
          Wire into resolve_folder_move (folder_classifier.py):
          - After LLM result, check if category_path's leaf language != source folder name's language
          - If mismatch: strip leaf from category_path, replace with source folder name (verbatim)
          - This kills "Design/Haus in Zypern" -> "Zeno/Documents/Haus in Zypern"
    complexity: "simple"
    files:
      - "sorter/language.py"
      - "sorter/folder_classifier.py"
    verify: "pytest tests/ -q --tb=line -x"
    depends_on:
      - batch_id: 1

  - id: 4
    title: "Tests for language preservation"
    status: "- [x] done"
    subagents:
      - name: "build"
        action: "create tests/test_language.py"
        details: |
          Tests:
          - detect_language: "Haus" -> de, "Ausbildung" -> de, "Entwürfe" -> de
          - detect_language: "Photos" -> en, "Documents" -> en, "Sunset Villa" -> en
          - detect_language: "Ελληνικά" -> el, "Φωτογραφίες" -> el
          - leaf_language_mismatch: leaf="Design", source="Haus in Zypern" -> True (en vs de)
          - leaf_language_mismatch: leaf="Entwürfe Logo", source="Logo" -> False (both de)
          - resolve_folder_move with LLM returning "Zeno/Documents/Design" for "Haus in Zypern"
            -> target ends in "/Haus in Zypern", not "/Design/Haus in Zypern"
          - resolve_folder_move with LLM returning "Media/Photos" for "Eigene Fotos"
            -> target ends in "/Eigene Fotos" (no mismatch -> leaf preserved anyway)
    complexity: "simple"
    files:
      - "tests/test_language.py"
    verify: "pytest tests/test_language.py -q --tb=line -x"

  - id: 5
    title: "Dry-run verification on Diverse Daten/"
    status: "- [x] done"
    subagents:
      - name: "build"
        action: "run dry-run on Diverse Daten/ sample"
        details: |
          Dry-run a subset of Diverse Daten/ to verify:
          - German folders -> destination leaf stays German (never gets invented English leaf)
          - Haus in Zypern -> leaf "Haus in Zypern" (not "Design/Haus in Zypern")
          - No new "Design" category invented for German content
          - File names preserved in original language
          - Existing tests still pass: pytest tests/ -q --tb=line
    complexity: "simple"
    verify: "dry-run output shows no English leaf invention for non-English content"

checkpoints:
  - "After BATCH 3: pytest tests/ -q --tb=line passes"
  - "After BATCH 5: dry-run shows Haus in Zypern -> clean German leaf"
  - "After BATCH 5: no English-invented subcategories for German content"